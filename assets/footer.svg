<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" fill="none">
  <defs>
    <linearGradient id="ftg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00ff9d"/>
      <stop offset="70%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="200" y="10" width="800" height="1" rx="0.5" fill="url(#ftg)" opacity="0.4"/>
  <text x="600" y="45" text-anchor="middle" font-family="'Cascadia Code','Fira Code',monospace" font-size="16" fill="#8892b0" filter="url(#glow4)">
    <tspan fill="#00ff9d">&lt;/&gt;</tspan>
    <tspan fill="#8892b0"> built with </tspan>
    <tspan fill="#ff5f57">♥</tspan>
    <tspan fill="#8892b0"> and too much </tspan>
    <tspan fill="#00d4ff">coffee</tspan>
    <tspan fill="#00ff9d">&lt;/&gt;</tspan>
  </text>
  <rect x="200" y="65" width="800" height="1" rx="0.5" fill="url(#ftg)" opacity="0.4"/>
  <circle cx="300" cy="37" r="1.5" fill="#00ff9d" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="37" r="1.5" fill="#7b61ff" opacity="0.5"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
</svg>