<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0f1629"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d">
        <animate attributeName="stop-color" values="#00ff9d;#00d4ff;#7b61ff;#00ff9d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7b61ff;#00ff9d;#00d4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7b61ff">
        <animate attributeName="stop-color" values="#7b61ff;#00ff9d;#00d4ff;#7b61ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>
  <!-- Animated grid lines -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"><animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/></line>
    <line x1="0" y1="120" x2="1200" y2="120"><animate attributeName="opacity" values="0.12;0.06;0.12" dur="5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="180" x2="1200" y2="180"><animate attributeName="opacity" values="0.06;0.15;0.06" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="240" x2="1200" y2="240"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>
  <!-- Decorative particles -->
  <circle cx="150" cy="80" r="2" fill="#00ff9d" opacity="0.6"><animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="200" r="1.5" fill="#00d4ff" opacity="0.5"><animate attributeName="cy" values="200;190;200" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="60" r="2" fill="#7b61ff" opacity="0.7"><animate attributeName="cy" values="60;50;60" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="220" r="1.5" fill="#00ff9d" opacity="0.5"><animate attributeName="cy" values="220;210;220" dur="2.5s" repeatCount="indefinite"/></circle>
  <!-- Decorative code brackets -->
  <text x="80" y="180" font-family="monospace" font-size="48" fill="#00d4ff" opacity="0.15">{</text>
  <text x="1100" y="180" font-family="monospace" font-size="48" fill="#00d4ff" opacity="0.15">}</text>
  <!-- Main name -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="url(#accent)" filter="url(#glow2)">AETHEL REBORN</text>
  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#8892b0" letter-spacing="8">SOFTWARE ENGINEER  ·  CREATOR  ·  PROBLEM SOLVER</text>
  <!-- Animated underline -->
  <rect x="350" y="215" width="500" height="2" rx="1" fill="url(#accent)" opacity="0.8">
    <animate attributeName="width" values="500;450;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="350;375;350" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Corner accents -->
  <path d="M20,20 L20,50 M20,20 L50,20" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>
  <path d="M1180,20 L1180,50 M1180,20 L1150,20" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <path d="M20,280 L20,250 M20,280 L50,280" stroke="#7b61ff" stroke-width="2" opacity="0.6"/>
  <path d="M1180,280 L1180,250 M1180,280 L1150,280" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>
</svg>